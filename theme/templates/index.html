{% extends "base.html" %}
{% block title %}Home - MSSB Tools{% endblock %}
{% block content %}
    <div class="relative isolate px-6 pt-14 lg:px-8">
        <div class="mx-auto max-w-2xl py-32 sm:py-48 lg:py-56">
            <div class="text-center">
                <h1 class="tracking-tight text-balance text-gray-900 dark:text-white sm:text-7xl text-shadow-lg">
                    Mario Superstar Baseball Tools
                </h1>
                <p class="mt-8 text-lg font-medium text-pretty text-gray-600 dark:text-gray-300 sm:text-xl/8">
                    A Baseball Savant-inspired stat tool for all characters in the game as
                    well as a draft tool for individual games and leagues
                </p>
                <div class="mt-10 flex items-center justify-center gap-x-6">
                    <a href="{% url 'stats:index' %}"
                       class="rounded-md bg-blue-600 px-3.5 py-2.5 text-sm font-semibold text-white shadow-xs hover:bg-blue-400 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600">
                    Stats</a>
                    <a href="#{% comment %} {% url 'draft:index' %} {% endcomment %}"
                       class="rounded-md bg-blue-600 px-3.5 py-2.5 text-sm font-semibold text-white shadow-xs hover:bg-blue-400 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600">
                    Draft</a>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
